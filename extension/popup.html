<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>xmd</title>
  <style>
    :root {
      color-scheme: light;
      --background: oklch(0.995 0 0);
      --foreground: oklch(0.18 0.005 286);
      --muted-foreground: oklch(0.55 0.012 286);
      --destructive: oklch(0.577 0.215 22);
    }
    body {
      font: 13px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      margin: 12px 14px;
      min-width: 240px;
      max-width: 360px;
      background: var(--background);
      color: var(--foreground);
    }
    .status { font-weight: 500; margin-bottom: 4px; }
    .status.err { color: var(--destructive); }
    .link {
      font: 11px/1.45 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      word-break: break-all;
      color: var(--muted-foreground);
      user-select: text;
    }
    .note { margin-top: 6px; color: var(--destructive); font-size: 12px; }
  </style>
</head>
<body>
  <div id="status" class="status"></div>
  <div id="link" class="link"></div>
  <div id="note" class="note"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
